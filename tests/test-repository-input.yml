name: Test repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: "octocat/Hello-World"
          issue-number: 1
          body: "Test comment with explicit repository input"

      - name: Assert action ran (succeeded or failed gracefully on non-accessible repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: action succeeded but comment-id output is empty"
              exit 1
            fi
            echo "PASS: comment created with id '$COMMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repository is not accessible with the provided token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
