name: Test comment creation with body-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create comment body file
        run: |
          mkdir -p /tmp/comment-test
          echo "This is a test comment from a file body-path." > /tmp/comment-test/body.md
          echo "It has multiple lines." >> /tmp/comment-test/body.md
          cat /tmp/comment-test/body.md

      - name: Create comment using body-path input
        id: create-comment
        uses: .
        with:
          token: ${{ github.token }}
          issue-number: 1
          body-path: /tmp/comment-test/body.md
        continue-on-error: true

      - name: Assert step ran (output or error)
        env:
          COMMENT_ID: ${{ steps.create-comment.outputs.comment-id }}
          OUTCOME: ${{ steps.create-comment.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: action succeeded but comment-id output is empty"
              exit 1
            fi
            echo "PASS: comment created with id=$COMMENT_ID"
          else
            echo "INFO: action did not succeed (expected under act without real GitHub token)"
            echo "PASS: action invoked correctly, API failure is expected in test environment"
          fi
