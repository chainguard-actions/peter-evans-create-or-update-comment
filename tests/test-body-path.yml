name: Test create comment with body-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create comment body file
        run: |
          echo "# Test Comment" > /tmp/comment-body.md
          echo "" >> /tmp/comment-body.md
          echo "This comment was created from a file via body-path input." >> /tmp/comment-body.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          issue-number: 1
          body-path: /tmp/comment-body.md

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: action succeeded but comment-id output is empty"
              exit 1
            fi
            echo "PASS: comment created from file with id '$COMMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
