name: Test update comment with comment-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          comment-id: 123456789
          body: "Updated comment body"
          edit-mode: replace
      - name: Assert action ran (input coverage)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: comment-id input was accepted"
