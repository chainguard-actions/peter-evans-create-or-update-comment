name: Test comment with reactions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          issue-number: 1
          body: "Comment with reactions!"
          reactions: "+1, hooray"
          reactions-edit-mode: append

      - name: Assert action ran (comment with reactions created or failed gracefully on sentinel repo)
        env:
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: action succeeded but comment-id output is empty"
              exit 1
            fi
            echo "PASS: comment with reactions created with id '$COMMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
