name: Test reactions and body-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment body file
        run: |
          echo "This is a test comment from body-file (deprecated)" > /tmp/comment-body-file.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          issue-number: 1
          body-file: /tmp/comment-body-file.md
          reactions: "+1, hooray"
          reactions-edit-mode: replace
      - name: Assert action ran (input coverage)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: reactions and body-file inputs were accepted"
